; Overrides for the stock www pool. Loaded after www.conf and zz-docker.conf
; (php-fpm includes php-fpm.d/*.conf alphabetically), so only list changes here.
; Sized for a 2GB host with MySQL off-box: ~20 workers x ~40MB busy RSS.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
